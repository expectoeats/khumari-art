<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#111010"/>

  <!-- Thin gold border -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="none" stroke="#C9A96E" stroke-width="1.2"/>

  <!-- K — left vertical stroke + two diagonals -->
  <line x1="11" y1="14" x2="11" y2="50" stroke="#F5F0E8" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="11" y1="32" x2="28" y2="14" stroke="#F5F0E8" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="11" y1="32" x2="28" y2="50" stroke="#F5F0E8" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Thin gold divider -->
  <line x1="33" y1="14" x2="33" y2="50" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/>

  <!-- S — top arc, middle arc, bottom arc (stylised S curve) -->
  <!-- Top cap of S -->
  <path d="M53 20 Q53 14 46 14 Q39 14 39 20 Q39 26 53 28 Q53 28 53 34 Q53 40 46 40 Q39 40 39 34"
        fill="none"
        stroke="#C9A96E"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
